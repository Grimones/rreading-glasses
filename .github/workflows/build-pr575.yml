name: build-pr575

on:
  push:
    branches: [pr575]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # adjust to whatever the Dockerfile actually uses
          build-args: |
            CMD=./cmd/rghc
          tags: |
            ghcr.io/${{ github.repository_owner }}/rreading-glasses:hardcover-pr575
            ghcr.io/${{ github.repository_owner }}/rreading-glasses:hardcover-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
